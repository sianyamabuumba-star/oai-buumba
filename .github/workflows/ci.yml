name: O'BUUMBA OS CI

on:
  push:
    branches: [main]
    paths:
      - "obuumbA-os/**"
      - "website/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "obuumbA-os/**"
      - "website/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obuumba-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Node.js self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: obuumbA-os
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run self-test
        run: npm test

  # Keep the public website checks dependency-free and separate from OS tests.
  website-check:
    name: Static website checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public website
        run: python3 website/tests/check_site.py
