name: O'BUUMBA OS Security and Tests
on:
  push:
    paths:
      - "obuumbA-os/**"
      - ".github/workflows/obuumba-os-test.yml"
      - "docs/SECURITY.md"
  pull_request:
    paths:
      - "obuumbA-os/**"
      - ".github/workflows/obuumba-os-test.yml"
      - "docs/SECURITY.md"
permissions:
  contents: read
concurrency:
  group: obuumba-os-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: obuumbA-os
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obuumbA-os/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run unit and HTTP security tests
        run: npm test
