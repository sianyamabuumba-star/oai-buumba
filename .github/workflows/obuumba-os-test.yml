name: O'BUUMBA OS Self Test
on:
  push:
    paths:
      - "obuumbA-os/**"
  pull_request:
    paths:
      - "obuumbA-os/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obuumbA-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obuumbA-os/package.json
      - run: npm install
      - run: npm test
